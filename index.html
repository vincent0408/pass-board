<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Board</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--accent:#2f6f5e;--accent-ink:#fff;--danger:#b3412f}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1f;--ink:#ececec;--muted:#9a9a9f;--line:#2e2e30;--accent:#6fbfa6;--accent-ink:#0f1f1a;--danger:#e07a68}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
header>div:first-child{flex-shrink:0;white-space:nowrap}
header>div:last-child{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#status{font-size:.8rem;color:var(--muted)}
button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel p{margin:0 0 10px;font-size:.9rem;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--muted);margin-right:auto}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.msg .text{white-space:pre-wrap;word-break:break-word}
.msg .meta{display:flex;align-items:center;gap:8px;margin-top:10px}
.msg time{font-size:.8rem;color:var(--muted);margin-right:auto}
.msg button{padding:6px 12px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.msg .text:empty{display:none}
.msg img{display:block;max-width:100%;max-height:360px;margin:0 auto;border-radius:8px;cursor:zoom-in;background:var(--bg)}
.msg img.full{max-height:none;cursor:zoom-out}
.msg .text:not(:empty)+img{margin-top:10px}
.msg .size{font-size:.75rem;color:var(--muted);margin-top:6px;text-align:center}
#composer.drag{outline:2px dashed var(--accent);outline-offset:-2px}
#preview{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px}
#preview img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--bg)}
#previewInfo{font-size:.8rem;color:var(--muted);margin-right:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Pass Board</h1>
      <div id="status">Not connected</div>
    </div>
    <div>
      <button id="copyAllBtn" class="primary" hidden>Copy all</button>
      <button id="refreshBtn" hidden>Refresh</button>
      <button id="settingsBtn" hidden>Settings</button>
    </div>
  </header>

  <section id="setup" class="panel" hidden>
    <p>Paste a GitHub token with only the <b>gist</b> scope. It's stored in this browser only. Do this once on each device.</p>
    <input id="tokenInput" type="password" placeholder="ghp_…" autocomplete="off">
    <div class="row">
      <button id="disconnectBtn" class="danger" hidden>Disconnect this device</button>
      <button id="saveTokenBtn" class="primary">Connect</button>
    </div>
  </section>

  <section id="composer" class="panel" hidden>
    <textarea id="input" placeholder="Paste or type something, or paste / drop an image…"></textarea>
    <div id="preview" hidden>
      <img id="previewImg" alt="">
      <span id="previewInfo"></span>
      <button id="clearImgBtn" type="button">Remove</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" hidden>
    <div class="row">
      <span class="hint">Ctrl/⌘ + Enter to post</span>
      <button id="imgBtn" type="button">Add image</button>
      <button id="postBtn" class="primary">Post</button>
    </div>
  </section>

  <section id="list"></section>
</main>

<script>
const API = 'https://api.github.com';
const DESC = 'pass-board-storage';
const FILE = 'board.json';
const MAX = 50;

// Images are stored as their own gist files (data URLs). GitHub returns up to
// 1 MB per file inline, so each image is compressed to fit under that.
const IMG_PREFIX = 'img-';
const IMG_MAX_BYTES = 700 * 1024;        // ~950 KB once base64-encoded
const IMG_MAX_INPUT = 25 * 1024 * 1024;  // refuse anything bigger before decoding
const IMG_MAX_DIM = 2048;                // longest side after resizing
const MAX_IMAGES = 10;                   // keep the newest image posts only
const IMG_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
};

let token = store.get('pb_token');
let gistId = store.get('pb_gist');
let messages = [];
let images = {};        // gist file name -> data URL
let gistFiles = [];     // file names currently in the gist
let etag = null;        // lets polls skip the download when nothing changed
let pending = null;     // image attached in the composer
let busy = false;

function status(t){ $('status').textContent = t; }

function fmtBytes(n) {
  return n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
}

async function gh(path, opts = {}) {
  const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', ...(opts.headers || {}) };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(API + path, { ...opts, headers, cache: 'no-store' });
  if (r.status === 304) return null;
  if (!r.ok) { const e = new Error(r.status + ' ' + (await r.text()).slice(0, 120)); e.status = r.status; throw e; }
  const data = await r.json();
  data._etag = r.headers.get('ETag');
  return data;
}

async function findOrCreateGist() {
  if (gistId) return;
  for (let page = 1; page <= 5; page++) {
    const list = await gh('/gists?per_page=100&page=' + page);
    const g = list.find(x => x.description === DESC);
    if (g) { gistId = g.id; store.set('pb_gist', gistId); return; }
    if (list.length < 100) break;
  }
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({
    description: DESC, public: false, files: { [FILE]: { content: '{"messages":[]}' } }
  })});
  gistId = g.id; store.set('pb_gist', gistId);
}

async function fileContent(f) {
  if (!f) return null;
  if (!f.truncated) return f.content;
  return (await fetch(f.raw_url, { cache: 'no-store' })).text();
}

async function load() {
  let g;
  try { g = await gh('/gists/' + gistId, etag ? { headers: { 'If-None-Match': etag } } : {}); }
  catch (e) {
    if (!e.status && etag) { etag = null; return load(); }  // retry once without the conditional header
    if (e.status === 404) { gistId = null; etag = null; store.set('pb_gist', null); await findOrCreateGist(); g = await gh('/gists/' + gistId); }
    else throw e;
  }
  if (!g) return false;  // 304: unchanged since the last load
  const content = (await fileContent(g.files[FILE])) || '{"messages":[]}';
  try { messages = JSON.parse(content).messages || []; } catch (e) { messages = []; }
  gistFiles = Object.keys(g.files);
  const next = {};
  for (const name of gistFiles) {
    if (!name.startsWith(IMG_PREFIX)) continue;
    next[name] = images[name] || await fileContent(g.files[name]);  // file names are unique, so cached copies stay valid
  }
  images = next;
  etag = g._etag;
}

async function save(extraFiles = {}) {
  const files = { [FILE]: { content: JSON.stringify({ messages }) }, ...extraFiles };
  const used = new Set(messages.filter(m => m.img).map(m => m.img.file));
  for (const name of gistFiles) {
    if (name.startsWith(IMG_PREFIX) && !used.has(name) && !(name in files)) files[name] = null;  // delete orphaned images
  }
  const g = await gh('/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files }) });
  gistFiles = Object.keys(g.files);
  for (const [name, f] of Object.entries(extraFiles)) if (f) images[name] = f.content;
  etag = null;
}

/* ---------- Images ---------- */
function safeImage(url) {
  return typeof url === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,/.test(url) ? url : null;
}

function readAsDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}

function decode(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read that image.")); };
    img.src = url;
  });
}

function encode(img, scale, type, quality) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = c.getContext('2d');
  if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }  // JPEG has no transparency
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b && { blob: b, w: c.width, h: c.height }), type, quality));
}

// Checks the size and shrinks the image until it fits in one gist file.
async function prepareImage(file) {
  if (!file.type.startsWith('image/')) throw new Error('That file is not an image.');
  if (file.size > IMG_MAX_INPUT) throw new Error(`Image is ${fmtBytes(file.size)}. The limit is ${fmtBytes(IMG_MAX_INPUT)}.`);
  const img = await decode(file);
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) throw new Error("Couldn't read that image.");

  if (IMG_TYPES.includes(file.type) && file.size <= IMG_MAX_BYTES && Math.max(w, h) <= IMG_MAX_DIM) {
    return { dataUrl: await readAsDataURL(file), type: file.type, bytes: file.size, w, h, original: file.size };
  }

  // WebP keeps screenshots sharp and small; browsers that can't encode it fall back to JPEG.
  const probe = await encode(img, Math.min(1, 64 / Math.max(w, h)), 'image/webp', 0.8);
  const type = probe && probe.blob.type === 'image/webp' ? 'image/webp' : 'image/jpeg';
  let scale = Math.min(1, IMG_MAX_DIM / Math.max(w, h));
  for (let i = 0; i < 12; i++) {
    for (const q of [0.85, 0.7, 0.55]) {
      const out = await encode(img, scale, type, q);
      if (out && out.blob.size <= IMG_MAX_BYTES) {
        return { dataUrl: await readAsDataURL(out.blob), type, bytes: out.blob.size, w: out.w, h: out.h, original: file.size };
      }
    }
    scale *= 0.75;
  }
  throw new Error("Couldn't shrink the image enough to post it.");
}

async function attach(file) {
  if (!file) return;
  status('Checking image…');
  try {
    pending = await prepareImage(file);
    pending.name = (file.name || 'image').replace(/\.[^.]*$/, '').replace(/[^\w.-]+/g, '_').slice(0, 60) || 'image';
    $('previewImg').src = pending.dataUrl;
    $('previewInfo').textContent = `${pending.w}×${pending.h} · ${fmtBytes(pending.bytes)}` +
      (pending.bytes < pending.original ? ` (was ${fmtBytes(pending.original)})` : '');
    $('preview').hidden = false;
    status('Image ready to post');
  } catch (e) {
    clearPending();
    status('Error: ' + e.message);
  }
}

function clearPending() {
  pending = null;
  $('preview').hidden = true;
  $('previewImg').removeAttribute('src');
  $('fileInput').value = '';
}

const EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' };

function downloadImage(m, url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = `${m.img.name || 'pass-board'}.${EXT[m.img.type] || 'png'}`;
  document.body.appendChild(a); a.click(); a.remove();
}

// Clipboards reliably accept only PNG, so other formats are converted first.
async function toPng(url) {
  const blob = await (await fetch(url)).blob();
  if (blob.type === 'image/png') return blob;
  const out = await encode(await decode(blob), 1, 'image/png');
  if (!out) throw new Error('convert failed');
  return out.blob;
}

async function copyImage(url, btn) {
  let ok = false;
  try {
    if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error('unsupported');
    // Passing a promise keeps Safari's user-gesture check happy while the PNG is prepared.
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': toPng(url) })]);
    ok = true;
  } catch (e) {}
  flash(btn, ok ? 'Copied' : 'Copy failed');
  if (!ok) status("This browser can't copy images. Use Download instead.");
}

/* ---------- Render ---------- */
function render() {
  const list = $('list');
  list.innerHTML = '';
  if (!messages.length) {
    const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nothing here yet.';
    list.appendChild(d); return;
  }
  for (const m of messages) {
    const card = document.createElement('div'); card.className = 'msg';
    const text = document.createElement('div'); text.className = 'text'; text.textContent = m.text || '';
    card.append(text);
    const meta = document.createElement('div'); meta.className = 'meta';
    const time = document.createElement('time'); time.textContent = new Date(m.ts).toLocaleString();
    meta.append(time);

    const url = m.img && safeImage(images[m.img.file]);
    if (m.img) {
      if (url) {
        const img = document.createElement('img');
        img.src = url; img.alt = m.img.name || 'Image'; img.loading = 'lazy';
        img.onclick = () => img.classList.toggle('full');
        const size = document.createElement('div'); size.className = 'size';
        size.textContent = `${m.img.w}×${m.img.h} · ${fmtBytes(m.img.bytes)}`;
        card.append(img, size);
        const copyImg = document.createElement('button'); copyImg.textContent = 'Copy image';
        copyImg.onclick = () => copyImage(url, copyImg);
        const dl = document.createElement('button'); dl.textContent = 'Download';
        dl.onclick = () => downloadImage(m, url);
        meta.append(copyImg, dl);
      } else {
        const missing = document.createElement('div'); missing.className = 'size'; missing.textContent = 'Image unavailable';
        card.append(missing);
      }
    }
    if (m.text) {
      const copy = document.createElement('button'); copy.textContent = m.img ? 'Copy text' : 'Copy';
      copy.onclick = () => copyText(m.text, copy);
      meta.append(copy);
    }
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = 'Delete';
    del.onclick = () => remove(m.id);
    meta.append(del);
    card.append(meta);
    list.appendChild(card);
  }
}

function flash(btn, label) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = label;
  setTimeout(() => btn.textContent = old, 1200);
}

function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

async function copyText(t, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; }
  catch (e) { ok = fallbackCopy(t); }
  flash(btn, ok ? 'Copied' : 'Copy failed');
}

function copyAll() {
  const all = messages.map(m => m.text).filter(Boolean).join('\n\n');
  if (!all) return;
  copyText(all, $('copyAllBtn'));
}

async function run(label, fn) {
  if (busy) return; busy = true; status(label);
  try { if (await fn() !== false) render(); status('Synced ' + new Date().toLocaleTimeString()); }
  catch (e) {
    status('Error: ' + e.message);
    if (e.status === 401) showSetup(true);
  }
  finally { busy = false; }
}

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function post() {
  const text = $('input').value.trim();
  const image = pending;
  if (!text && !image) return;
  run('Posting…', async () => {
    await load();
    const m = { id: newId(), text, ts: Date.now() };
    const extra = {};
    if (image) {
      const file = IMG_PREFIX + m.id + '.txt';
      m.img = { file, type: image.type, bytes: image.bytes, w: image.w, h: image.h, name: image.name };
      extra[file] = { content: image.dataUrl };
    }
    messages.unshift(m);
    messages = messages.slice(0, MAX);
    let count = 0;
    messages = messages.filter(x => !x.img || ++count <= MAX_IMAGES);  // drop the oldest image posts
    await save(extra);
    $('input').value = '';
    if (image === pending) clearPending();
  });
}

function remove(id) {
  run('Deleting…', async () => { await load(); messages = messages.filter(m => m.id !== id); await save(); });
}

function refresh() { run('Loading…', load); }

function showSetup(show) {
  $('setup').hidden = !show;
  $('disconnectBtn').hidden = !token;
}

function connected() {
  $('composer').hidden = false;
  $('copyAllBtn').hidden = false;
  $('refreshBtn').hidden = false;
  $('settingsBtn').hidden = false;
  showSetup(false);
}

$('saveTokenBtn').onclick = () => {
  const t = $('tokenInput').value.trim();
  if (!t) return;
  token = t; store.set('pb_token', t); $('tokenInput').value = '';
  run('Connecting…', async () => { await findOrCreateGist(); await load(); connected(); });
};
$('disconnectBtn').onclick = () => {
  token = null; gistId = null; etag = null; store.set('pb_token', null); store.set('pb_gist', null);
  messages = []; images = {}; gistFiles = []; clearPending();
  render(); $('composer').hidden = true; $('refreshBtn').hidden = true; $('copyAllBtn').hidden = true;
  $('settingsBtn').hidden = true; showSetup(true); status('Not connected');
};
$('settingsBtn').onclick = () => showSetup($('setup').hidden);
$('refreshBtn').onclick = refresh;
$('copyAllBtn').onclick = copyAll;
$('postBtn').onclick = post;
$('imgBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = () => attach($('fileInput').files[0]);
$('clearImgBtn').onclick = () => { clearPending(); status('Image removed'); };
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) post(); });
$('input').addEventListener('paste', e => {
  const file = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (file) { e.preventDefault(); attach(file); }
});
const composer = $('composer');
composer.addEventListener('dragover', e => { e.preventDefault(); composer.classList.add('drag'); });
composer.addEventListener('dragleave', () => composer.classList.remove('drag'));
composer.addEventListener('drop', e => {
  e.preventDefault(); composer.classList.remove('drag');
  attach([...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/')));
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && token) refresh(); });
setInterval(() => { if (!document.hidden && token && !busy) run('Loading…', load); }, 15000);

if (token) run('Connecting…', async () => { await findOrCreateGist(); await load(); connected(); });
else showSetup(true);
</script>
</body>
</html>
